
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Angels Daycare</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff7f9;
      margin: 0;
      padding: 24px;
      color: #493a44;
    }
    .app {
      max-width: 520px;
      margin: auto;
    }
    h1 { color: #b96b91; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin: 14px 0;
      box-shadow: 0 3px 12px #00000010;
    }
    button {
      background: #b96b91;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      width: 100%;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Little Angels Daycare</h1>
    <p>Que el amor sea tu guía</p>

    <div class="card">
      <h2>Attendance</h2>
      <p>Daily check-in and check-out</p>
      <button disabled>Coming soon</button>
    </div>

    <div class="card">
      <h2>Nap Checks</h2>
      <p>Record actual sleep safety checks</p>
      <button disabled>Coming soon</button>
    </div>

    <div class="card">
      <h2>Daily Reports</h2>
      <p>Meals, diapers and activities</p>
      <button disabled>Coming soon</button>
    </div>

    <p>Private access and cloud storage will be added next.</p>
  </main>
</body>
</html>
